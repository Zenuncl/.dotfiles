# Account definition — copy this file to create a real account:
#   cp example.conf personal.conf
# Then run: bash ~/.dotfiles/mail/gen.sh
#
# Gmail (password):  ACCOUNT, TYPE=gmail, FULLNAME, EMAIL, PASS_ENTRY
# Gmail (OAuth):     + AUTH=google-oauth, CLIENT_ID, CLIENT_SECRET
# Generic IMAP:      + IMAP_HOST, SMTP_HOST
# Outlook (OAuth):   + AUTH=microsoft-oauth, CLIENT_ID

ACCOUNT=personal
TYPE=gmail                  # gmail | generic
AUTH=password               # password | google-oauth | microsoft-oauth
FULLNAME="Your Name"
EMAIL=you@gmail.com
PASS_ENTRY=email/gmail      # `pass` entry: password or OAuth refresh token

# FROM_ADDRESS — set only if your sending address differs from EMAIL.
# FROM_ADDRESS=alias@gmail.com

# Generic IMAP — set if TYPE=generic:
# IMAP_HOST=imap.example.com
# IMAP_PORT=993
# SMTP_HOST=smtp.example.com
# SMTP_PORT=587

# OAuth — set if AUTH=google-oauth or AUTH=microsoft-oauth:
#   1. Set CLIENT_ID (and CLIENT_SECRET for Google)
#   2. Run: bash oauth.sh accounts/this-file.conf
#   3. Authorize via the URL shown (works from any device)
#   4. Refresh token is saved to PASS_ENTRY automatically
# CLIENT_ID=your-client-id
# CLIENT_SECRET=your-client-secret       # Google only
# OAUTH_TENANT=common                    # Microsoft only (common | organizations | tenant-guid)
