# Account definition — copy this file to create a real account:
#   cp example.conf personal.conf
# Then run: bash ~/.dotfiles/mail/gen.sh
#
# Gmail only needs 5 fields (host/port are automatic):
#   ACCOUNT, TYPE=gmail, FULLNAME, EMAIL, PASS_ENTRY
#
# Generic IMAP needs IMAP_HOST and SMTP_HOST too.

ACCOUNT=personal
TYPE=gmail                  # gmail | generic
FULLNAME="Your Name"
EMAIL=you@gmail.com
PASS_ENTRY=email/gmail      # `pass` entry name

# FROM_ADDRESS — set only if your sending address differs from EMAIL
# (e.g. alias, shared mailbox). If unset, EMAIL is used as From.
# FROM_ADDRESS=alias@gmail.com

# Generic IMAP — uncomment if TYPE=generic:
# IMAP_HOST=imap.example.com
# IMAP_PORT=993
# SMTP_HOST=smtp.example.com
# SMTP_PORT=587
