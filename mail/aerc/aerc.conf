# ─── aerc — main config ────────────────────────────────────────────────────────
# Requires: lynx, pandoc, pass
#
# Symlink: ~/.config/aerc → ~/.dotfiles/mail/aerc
#
# Accounts: run gen.sh to generate accounts.conf from accounts/*.conf,
# or manually copy accounts.conf.example.

[general]
unsafe-accounts-conf = false
log-file = /dev/null
log-level = error

[ui]
# ─── Index columns (Nerd Font icons) ─────────────────────────────────────────

index-columns = flags<4,name<20%,subject<*,date>16
column-flags = {{.Flags | join ""}}
column-name = {{index (.From | names) 0}}
column-subject = {{.ThreadPrefix}}{{.Subject}}
column-date = {{.DateAutoFormat .Date.Local}}

# ─── Sidebar / folder list ───────────────────────────────────────────────────

sidebar-width = 28
dirlist-left = {{.Folder}}
dirlist-right = {{if .Unread}}{{.Unread}}/{{end}}{{.Exists}}
dirlist-delay = 200ms
dirlist-tree = true

# ─── Sorting & threading ────────────────────────────────────────────────────

sort = -r date
threading-enabled = true
force-client-threads = true
client-threads-delay = 50ms

# ─── Misc ────────────────────────────────────────────────────────────────────

mouse-enabled = false
new-message-bell = true
styleset-name = catppuccin-macchiato
folder-sort = INBOX,Sent,Drafts,Archive,[Gmail]/All Mail,Junk,Spam,Trash
spinner = "|/-\\"
tab-title-account = {{.Account}}
tab-title-composer = {{.Subject}}

[statusline]
status-columns = left<*,center>=,right>*
column-left = [{{.Account}}] {{.StatusInfo}}
column-center = {{.TrayInfo}}
column-right = {{.PendingKeys}}

[viewer]
pager = less -Rc
alternatives = text/plain,text/html
header-layout = From|To,Cc|Bcc,Date,Subject
show-headers = false
always-show-mime = false

[compose]
header-layout = To|From,Subject
reply-to-self = false
no-attachment-warning = ^[^>]*attach
edit-headers = false
# editor = nvim +':set textwidth=72' +':set wrapmargin=0' +':set wrap' +':set spell'

[multipart-converters]
text/html = pandoc -f markdown -t html --standalone

[filters]
text/plain = colorize
text/html = lynx -assume_charset=utf-8 -display_charset=utf-8 -collapse_br_tags -dump -stdin
text/calendar = ~/.config/aerc/filters/ical
application/ics = ~/.config/aerc/filters/ical
text/markdown = pandoc -f markdown -t html | lynx -assume_charset=utf-8 -display_charset=utf-8 -collapse_br_tags -dump -stdin
text/x-markdown = pandoc -f markdown -t html | lynx -assume_charset=utf-8 -display_charset=utf-8 -collapse_br_tags -dump -stdin
text/x-diff = delta
text/x-patch = delta

[hooks]
# Uncomment to get desktop notifications on new mail:
# mail-received = notify-send "New mail from $AERC_FROM_NAME" "$AERC_SUBJECT"

[templates]
template-dirs = ~/.config/aerc/templates

# ─── GPG / PGP ────────────────────────────────────────────────────────────────
# Per-account PGP settings go in accounts.conf:
#   pgp-auto-sign = true
#   pgp-self-encrypt = true
#   pgp-key-id = YOUR_KEY_ID

[openers]
