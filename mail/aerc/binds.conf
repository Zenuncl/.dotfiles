# ─── aerc keybindings — vim nav + Gmail-style shortcuts ───────────────────────
# Ported from neomutt binds.muttrc

# ─── Message list ─────────────────────────────────────────────────────────────

[messages]
q = :quit<Enter>

# Navigation (vim)
j = :next<Enter>
<Down> = :next<Enter>
k = :prev<Enter>
<Up> = :prev<Enter>
gg = :select 0<Enter>
G = :select -1<Enter>
<C-d> = :next 50%<Enter>
<C-u> = :prev 50%<Enter>

# Open message
l = :view<Enter>
<Enter> = :view<Enter>

# Compose / reply / forward
c = :compose<Enter>
r = :reply<Enter>
a = :reply -a<Enter>
f = :forward<Enter>

# Gmail-style mail operations
e = :archive flat<Enter>
d = :move Trash<Enter>
D = :delete<Enter>
s = :flag<Enter>
S = :unflag<Enter>
u = :read -t<Enter>
x = :mark -t<Enter>
X = :unmark -a<Enter>
! = :move Spam<Enter>

# Folder navigation (Gmail: g prefix)
gi = :cf Inbox<Enter>
gs = :cf Sent<Enter>
gd = :cf Drafts<Enter>
gt = :cf Trash<Enter>
ga = :cf Archive<Enter>

# Folder list navigation
J = :next-folder<Enter>
K = :prev-folder<Enter>
<C-o> = :cf<space>

# Sync
O = :check-mail<Enter>

# Search
/ = :search<space>

# Threading
<Space> = :toggle-threads<Enter>
v = :fold<Enter>
zM = :fold<Enter>
zR = :unfold<Enter>

# Account / tab switching
<Tab> = :next-tab<Enter>
<BackTab> = :prev-tab<Enter>

# URL extraction
<C-l> = :pipe -m urlscan<Enter>

# Notmuch global search (opens in embedded terminal)
\eg = :term sh -c 'printf "notmuch: " && read q && notmuch search "$q"'<Enter>

# ─── Message viewer (pager) ──────────────────────────────────────────────────
# j/k/gg/G/Ctrl-d/Ctrl-u are NOT bound here — they pass through to the
# pager (less) for native scrolling.

[view]
q = :close<Enter>
h = :close<Enter>

# Navigate between messages while in view
J = :next<Enter>
K = :prev<Enter>

# Compose / reply / forward
r = :reply<Enter>
a = :reply -a<Enter>
f = :forward<Enter>

# Mail operations
e = :archive flat<Enter>
d = :move Trash<Enter>
D = :delete<Enter>
s = :flag<Enter>
S = :unflag<Enter>

# Headers / attachments
H = :toggle-headers<Enter>
o = :open<Enter>
| = :pipe<space>
p = :save<space>

# Links
<C-l> = :open-link<space>

# MIME part switching
<C-n> = :next-part<Enter>
<C-p> = :prev-part<Enter>

# Enter passthrough for pager search (/)
/ = :toggle-key-passthrough<Enter>/

# ─── Pager passthrough ──────────────────────────────────────────────────────
# When passthrough is active, all keys go to the pager (less).
# Escape returns to normal view bindings.

[view::passthrough]
$noinherit = true
$ex = <semicolon>
<Esc> = :toggle-key-passthrough<Enter>

# ─── Compose — editor ────────────────────────────────────────────────────────

[compose]
$ex = <C-x>
<C-q> = :abort<Enter>

[compose::editor]
$noinherit = true
$ex = <C-x>
<C-q> = :abort<Enter>

# ─── Compose — review before sending ─────────────────────────────────────────

[compose::review]
y = :send<Enter>
n = :abort<Enter>
p = :postpone<Enter>
q = :abort<Enter>
e = :edit<Enter>
a = :attach<space>
d = :detach<space>
